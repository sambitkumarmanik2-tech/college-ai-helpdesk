<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sai Vidyapeeth AI Helpdesk | Sambit Kumar Manik</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
  body { background: #e2e8f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
  .box { width: 100%; max-width: 450px; background: #fff; border-radius: 16px; box-shadow: 0 8px 25px rgba(0,0,0,0.15); overflow: hidden; display: flex; flex-direction: column; height: 88vh; position: relative; }
  .head { background: #1e3a8a; color: #fff; padding: 14px; text-align: center; border-bottom: 3px solid #f59e0b; }
  .badge { background: rgba(255,255,255,0.2); padding: 3px 10px; border-radius: 10px; font-size: 11px; color: #fde68a; display: inline-block; margin-bottom: 4px; }
  .call-btn { background: #16a34a; color: #fff; border: none; padding: 7px 14px; border-radius: 20px; font-size: 12px; font-weight: bold; margin-top: 8px; cursor: pointer; }
  .credit { background: #eff6ff; color: #1e3a8a; text-align: center; padding: 5px; font-size: 11.5px; font-weight: bold; border-bottom: 1px solid #dbeafe; }
  .chat { flex: 1; padding: 14px; overflow-y: auto; background: #f8fafc; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.4; }
  .bot { background: #fff; color: #1e293b; align-self: flex-start; border: 1px solid #cbd5e1; }
  .user { background: #2563eb; color: #fff; align-self: flex-end; }
  .btns { display: flex; gap: 6px; padding: 8px; overflow-x: auto; background: #f1f5f9; border-top: 1px solid #e2e8f0; }
  .btns button { background: #fff; border: 1px solid #2563eb; color: #1e40af; padding: 6px 12px; border-radius: 15px; font-size: 12px; font-weight: bold; white-space: nowrap; cursor: pointer; }
  .inp { display: flex; padding: 10px; background: #fff; border-top: 1px solid #cbd5e1; }
  .inp input { flex: 1; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; font-size: 14px; }
  .inp button { background: #1e40af; color: #fff; border: none; padding: 10px 16px; margin-left: 8px; border-radius: 8px; font-weight: bold; cursor: pointer; }
  .foot { background: #0f172a; color: #94a3b8; text-align: center; padding: 6px; font-size: 11px; }
  .foot span { color: #fde68a; font-weight: bold; }
  .call-ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #0f172a; color: #fff; display: none; flex-direction: column; justify-content: space-between; align-items: center; padding: 35px 20px; text-align: center; z-index: 20; }
  .mic { background: #2563eb; color: #fff; border: none; width: 65px; height: 65px; border-radius: 50%; font-size: 16px; font-weight: bold; cursor: pointer; }
  .end { background: #dc2626; color: #fff; border: none; width: 65px; height: 65px; border-radius: 50%; font-size: 16px; font-weight: bold; cursor: pointer; }
</style>
<script>
  var db = {
    "principal": "<b>Respected Principal Sir:</b><br>Hamare Sai Vidyapeeth ke Principal Sir ka naam <b>Er. Ashis Kumar Dash</b> (M.Tech in CSE) hai.",
    "fees": "<b>Fee Structure (Non-Scholarship):</b><br>Course Fees: Rs. 40,000<br>Hostel Fees: Rs. 60,000<br><i>(Scholarship students ke liye govt. rules laagu hote hain.)</i>",
    "hostel": "<b>Hostel & Course Fees (Non-Scholarship):</b><br>Hostel Fees: Rs. 60,000<br>Course Fees: Rs. 40,000",
    "address": "<b>College Address:</b><br>Sai Vidyapeeth, At - Phula Alasa, PO - Mula Alasa, Via/PS - Satyabadi (near Sakhigopal), Dist. - Puri, Odisha - 752014.",
    "name": "<b>College Name:</b><br>Hamare college ka naam <b>Sai Vidyapeeth</b> hai (AICTE Approved & SCTE&VT Odisha Affiliated).",
    "branch": "<b>Available Branches:</b><br>1. AI & Machine Learning (AI & ML)<br>2. Electrical Engineering (EE)<br>3. Electrical & Electronics (EEE)<br>4. Mechanical Engineering (ME)",
    "timing": "<b>College Timing:</b><br>Monday to Saturday, 9:00 AM se 4:00 PM tak.",
    "contact": "<b>Contact Details:</b><br>Phone: +91 94384 77565 / 06752-273238<br>Website: ://saividyapeeth.com",
    "scholarship": "<b>Scholarship:</b><br>Odisha ke students ke liye Post-Matric Scholarship aur Govt. schemes uplabdh hain.",
    "developer": "<b>Developer Credit:</b><br>Is AI Helpdesk ko <b>Sambit Kumar Manik</b> (1st Year, Diploma in AI & ML, Sai Vidyapeeth Puri) ne banaya hai!"
  };

  var voiceDb = {
    "principal": "Aama Sai Vidyapeeth college ra Principal Sir nka naama Engineer Ashis Kumar Dash ate.",
    "fees": "Non-scholarship chhatra chhatri nka pain course fees 40 hazar tanka ebang hostel fees 60 hazar tanka ate.",
    "hostel": "Non-scholarship pain hostel fees 60 hazar tanka ebang course fees 40 hazar tanka ate.",
    "address": "Sai Vidyapeeth Puri jilla ra Sakhigopal nikatasta Satyabadi Phula Alasa thare abasthita.",
    "name": "Aama college ra naama Sai Vidyapeeth ate.",
    "branch": "Aama college re AI and Machine Learning, Electrical, EEE ebang Mechanical diploma branch rahichi.",
    "timing": "College samaya Somabara tharu Shanibara sakala 9 ta ru aparahna 4 ta parjyanta ate.",
    "contact": "College office saha jogajoga pain 94384 77565 number re call karantu.",
    "scholarship": "Odisha sarkaranka Post Matric Scholarship subidha aama college re upalabdha achhi.",
    "developer": "Ehi AI Helpdesk ku Sai Vidyapeeth prathama barsha ra AI chhatra Sambit Kumar Manik prastuta karichhanti."
  };

  function pushMsg(html, cls) {
    var box = document.getElementById("chatBox");
    var div = document.createElement("div");
    div.className = "msg " + cls;
    div.innerHTML = html;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  }

  function getReply(q, isVoice) {
    q = q.toLowerCase();
    var source = isVoice ? voiceDb : db;
    for (var key in source) {
      if (q.indexOf(key) !== -1) return source[key];
    }
    return isVoice
      ? "Dhanyabad! Adhika suchana pain Sai Vidyapeeth office 94384 77565 re jogajoga karantu."
      : "Dhanyawad! Adhik jankari ke liye <b>Sai Vidyapeeth, Puri</b> office (+91 94384 77565) me sampark karein.";
  }

  function sendText() {
    var inp = document.getElementById("msgInput");
    var txt = inp.value.trim();
    if (!txt) return;
    pushMsg(txt, "user");
    inp.value = "";
    var ans = getReply(txt, false);
    setTimeout(function() { pushMsg(ans, "bot"); }, 200);
  }

  function quickAsk(topic) {
    pushMsg(topic, "user");
    var ans = getReply(topic, false);
    setTimeout(function() { pushMsg(ans, "bot"); }, 200);
  }

  var rec;
  function speakNow(txt, done) {
    if (!window.speechSynthesis) { if (done) done(); return; }
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(txt);
    u.lang = "or-IN";
    u.rate = 0.95;
    u.onend = function() { if (done) done(); };
    u.onerror = function() { if (done) done(); };
    window.speechSynthesis.speak(u);
  }

  function openCall() {
    var cb = document.getElementById("callBox");
    if (!cb) return;
    cb.style.display = "flex";
    var intro = "Namaskar! Sai Vidyapeeth AI Helpdesk ku swagata. Apana Principal, Fees, Hostel, ki Address bisayare pachari paribe.";
    document.getElementById("voiceText").innerText = intro;
    document.getElementById("callStatus").innerText = "AI Speaking...";
    speakNow(intro, function() { startMic(); });
  }

  function startMic() {
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      document.getElementById("callStatus").innerText = "Mic sirf Chrome browser mein chalega";
      return;
    }
    rec = new SR();
    rec.lang = "or-IN";
    rec.start();
    document.getElementById("callStatus").innerText = "Listening... Ebe kuhantu";
    rec.onresult = function(ev) {
      var said = ev.results[0][0].transcript;
      document.getElementById("voiceText").innerText = "Apana: " + said;
      var reply = getReply(said, true);
      setTimeout(function() {
        document.getElementById("voiceText").innerText = "AI: " + reply;
        document.getElementById("callStatus").innerText = "AI Speaking...";
        speakNow(reply, function() {
          document.getElementById("callStatus").innerText = "Tap Mic to speak again";
        });
      }, 250);
    };
    rec.onerror = function() {
      document.getElementById("callStatus").innerText = "Tap Mic and speak again";
    };
  }

  function closeCall() {
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    if (rec) rec.stop();
    var cb = document.getElementById("callBox");
    if (cb) cb.style.display = "none";
  }
</script>
</head>
<body>

<div class="box">
  <div class="head">
    <div class="badge">SAI VIDYAPEETH, PURI (ODISHA)</div>
    <h3>Smart College AI Helpdesk</h3>
    <button type="button" class="call-btn" onclick="openCall()">Odia Voice Call with AI</button>
  </div>
  <div class="credit">Project by: Sambit Kumar Manik (1st Year, AI & ML)</div>

  <div class="chat" id="chatBox">
    <div class="msg bot">Namaskar & Welcome to <b>Sai Vidyapeeth, Puri</b>! Neeche button dabayein, type karein, ya upar Voice Call par baat karein.</div>
  </div>

  <div class="btns">
    <button type="button" onclick="quickAsk('Principal')">Principal Sir</button>
    <button type="button" onclick="quickAsk('Fees')">Fees & Hostel</button>
    <button type="button" onclick="quickAsk('Address')">Address</button>
    <button type="button" onclick="quickAsk('Branches')">Branches</button>
    <button type="button" onclick="quickAsk('Scholarship')">Scholarship</button>
    <button type="button" onclick="quickAsk('Contact')">Contact</button>
    <button type="button" onclick="quickAsk('Developer')">Developer</button>
  </div>

  <div class="inp">
    <input type="text" id="msgInput" placeholder="Apna sawal likhein...">
    <button type="button" onclick="sendText()">Send</button>
